services:

  postgres:
    image: postgres:16
    container_name: serviceflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: serviceflowpassword
      POSTGRES_DB: serviceflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - serviceflow-network


  redis:
    image: redis:7-alpine
    container_name: serviceflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - serviceflow-network


  backend:
    build:
      context: ./backend

    container_name: serviceflow-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      - postgres
      - redis

    networks:
      - serviceflow-network


  frontend:
    build:
      context: ./frontend

    container_name: serviceflow-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - serviceflow-network


volumes:

  postgres_data:


networks:

  serviceflow-network:
    driver: bridge